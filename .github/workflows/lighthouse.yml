name: GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PUBLIC_GISCUS_REPO: ${{ vars.PUBLIC_GISCUS_REPO }}
  PUBLIC_GISCUS_REPO_ID: ${{ vars.PUBLIC_GISCUS_REPO_ID }}
  PUBLIC_GISCUS_CATEGORY: ${{ vars.PUBLIC_GISCUS_CATEGORY || 'Announcements' }}
  PUBLIC_GISCUS_CATEGORY_ID: ${{ vars.PUBLIC_GISCUS_CATEGORY_ID }}
  PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.PUBLIC_GOOGLE_SITE_VERIFICATION }}

jobs:
  lighthouse:
    name: Lighthouse (${{ matrix.form_factor }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        form_factor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Require 100 in Performance, Accessibility, Best Practices, and SEO
        run: npm run audit -- --${{ matrix.form_factor }}
      - name: Upload the audited site for GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && matrix.form_factor == 'mobile'
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Keep the reports, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-${{ matrix.form_factor }}
          path: .lighthouse/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    name: Deploy to GitHub Pages
    needs: lighthouse
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish the audited site
        id: deployment
        uses: actions/deploy-pages@v4
